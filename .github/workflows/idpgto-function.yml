name: IDPGTO payment function maintenance

on:
  push:
    branches: [fix/idpgto-vinculo-obrigatorio]
    paths:
      - .github/workflows/idpgto-function.yml
      - scripts/aws-idpgto-maintenance.py

permissions:
  contents: read

jobs:
  function:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: sa-east-1
      AWS_PAGER: ''
    steps:
      - uses: actions/checkout@v4
      - name: Inspect only the authorized payment function
        run: python3 scripts/aws-idpgto-maintenance.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: idpgto-function-evidence
          path: .idpgto-evidence/
          retention-days: 7
