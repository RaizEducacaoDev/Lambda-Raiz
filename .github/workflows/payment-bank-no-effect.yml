name: Prepare bank no-effect adjudication read-only
on:
  push:
    branches: [fix/idpgto-vinculo-obrigatorio]
    paths:
      - scripts/adjudicate-payment-bank-no-effect.py
      - tests/test_payment_bank_no_effect.py
      - .github/workflows/payment-bank-no-effect.yml
permissions:
  contents: read
  actions: read
concurrency:
  group: payment-backlog-bank-lease
  cancel-in-progress: false
jobs:
  prepare:
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/fix/idpgto-vinculo-obrigatorio' && github.run_attempt == 1 }}
    runs-on: ubuntu-22.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: 71bda76c539ea155320aec4f46de0679de5da4a6
          path: .bank-original-code
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: .bank-original-code/package-lock.json
      - run: npm ci --legacy-peer-deps --no-audit --no-fund
        working-directory: .bank-original-code
      - name: Offline immutable receipt and atomic CAS tests
        run: python3 -m unittest discover -s tests -p test_payment_bank_no_effect.py
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 41905310017
          name: payment-bank-repair-evidence
          path: .failed-bank-attempt
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 41905310017
          name: payment-bank-repair-lease-evidence
          path: .failed-bank-lease
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 41908274896
          name: uncertain-creation-removal-release
          path: .verified-runtime-release
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 41908274896
          name: uncertain-creation-removal-independent-readback
          path: .verified-runtime-independent
      - name: Read unchanged financial evidence and propose receipt without writing
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: sa-east-1
          AWS_MAX_ATTEMPTS: '1'
          AWS_PAGER: ''
          GH_TOKEN: ${{ github.token }}
          RECONCILE_ZEEV_TOKEN: ${{ secrets.RECONCILE_ZEEV_TOKEN }}
        run: python3 scripts/adjudicate-payment-bank-no-effect.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: payment-bank-no-effect-proposal
          path: .payment-bank-no-effect/
          include-hidden-files: true
          retention-days: 7
