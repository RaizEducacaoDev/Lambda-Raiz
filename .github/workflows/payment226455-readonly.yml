name: Read-only diagnosis of payment 226455
on:
  push:
    branches: [fix/idpgto-vinculo-obrigatorio]
    paths:
      - .github/workflows/payment226455-readonly.yml
      - scripts/audit-payment-226455.py
permissions:
  contents: read
jobs:
  read-only:
    runs-on: ubuntu-22.04
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 scripts/audit-payment-conflict-20261103-0609.py --self-test
      - name: Read current runtime, reservation and complete ticket request logs
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: sa-east-1
          AWS_PAGER: ''
          INCIDENT_ORIGINAL_ONLY: '1'
        run: python3 scripts/audit-payment-226455.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: payment226455-readonly-evidence
          path: .payment-226455-audit/
          include-hidden-files: true
          retention-days: 7
