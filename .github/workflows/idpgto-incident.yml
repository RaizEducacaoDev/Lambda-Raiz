name: IDPGTO read-only incident correlation
on:
  push:
    branches: [fix/idpgto-vinculo-obrigatorio]
    paths:
      - .github/workflows/idpgto-incident.yml
      - scripts/audit-idpgto-incident.py
permissions:
  contents: read
jobs:
  incident:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Read pending reservation and correlated logs
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: sa-east-1
          AWS_PAGER: ''
        run: python3 scripts/audit-idpgto-incident.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: idpgto-incident-evidence
          path: .idpgto-incident/
          include-hidden-files: true
          retention-days: 7
