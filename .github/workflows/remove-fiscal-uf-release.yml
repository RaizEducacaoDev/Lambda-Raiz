name: Remove payment fiscal geography guard
on:
  push:
    branches: [fix/remove-fiscal-uf-20261104]
    paths:
      - .github/workflows/remove-fiscal-uf-release.yml
      - scripts/release-fiscal-uf-removal.py
      - src/functions/rm/post/pagamentoFiscal.ts
permissions:
  contents: read
concurrency:
  group: payment-function-production-publication
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-22.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci --legacy-peer-deps --no-audit --no-fund
      - run: npm run verify:pagamento
      - run: python3 scripts/release-fiscal-uf-removal.py prepare
      - name: Publish only the authorized fiscal module change
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: sa-east-1
          AWS_PAGER: ''
        run: python3 scripts/release-fiscal-uf-removal.py release
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fiscal-uf-removal-release
          path: .fiscal-uf-release/
          include-hidden-files: true
          retention-days: 14
  readback:
    needs: release
    runs-on: ubuntu-22.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: fiscal-uf-removal-release
          path: .release-evidence
      - name: Independently verify the active AWS package
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: sa-east-1
          AWS_PAGER: ''
        run: python3 scripts/release-fiscal-uf-removal.py readback --evidence .release-evidence
      - name: Monitor execution errors for five minutes and reread active code
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: sa-east-1
          AWS_PAGER: ''
        run: python3 scripts/release-fiscal-uf-removal.py monitor --evidence .release-evidence
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fiscal-uf-removal-independent-readback
          path: .fiscal-uf-release/
          include-hidden-files: true
          retention-days: 14
