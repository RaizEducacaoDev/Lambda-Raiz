name: Read-only diagnosis payment preflight 1744
on:
  push:
    branches: [fix/payment-preflight-503-20261104]
    paths:
      - .github/workflows/payment-preflight-1744-readonly.yml
      - scripts/audit-payment-preflight-1744.py
permissions:
  contents: read
jobs:
  diagnosis:
    runs-on: ubuntu-22.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Read fixed CloudWatch windows and one durable reservation
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: sa-east-1
          AWS_PAGER: ''
        run: python3 scripts/audit-payment-preflight-1744.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: payment-preflight-1744-readonly
          path: .preflight-1744-audit/readback.json
          include-hidden-files: true
          retention-days: 7
