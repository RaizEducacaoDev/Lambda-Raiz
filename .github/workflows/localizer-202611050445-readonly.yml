name: Read payment error window 202611050445 only
on:
  push:
    branches: [audit/payment-226927-final-error-20261105]
    paths:
      - scripts/audit-localizer-202611050445.py
      - .github/workflows/localizer-202611050445-readonly.yml
permissions:
  contents: read
jobs:
  audit:
    if: ${{ github.run_attempt == 1 }}
    runs-on: ubuntu-22.04
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - name: Read sanitized logs only
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: sa-east-1
          AWS_MAX_ATTEMPTS: '1'
          AWS_PAGER: ''
        run: python3 scripts/audit-localizer-202611050445.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: localizer-202611050445-readonly
          path: .localizer-202611050445/
          include-hidden-files: true
          retention-days: 7
