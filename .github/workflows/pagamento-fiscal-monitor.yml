name: Payment fiscal post-release read-only audit
on:
  push:
    branches: [fix/idpgto-vinculo-obrigatorio]
    paths:
      - .github/workflows/pagamento-fiscal-monitor.yml
      - scripts/monitor-pagamento-fiscal.py
permissions:
  contents: read
jobs:
  read-only:
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Read existing reservation, execution termination and release logs
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: sa-east-1
          AWS_PAGER: ''
        run: python3 scripts/monitor-pagamento-fiscal.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pagamento-fiscal-post-release-readback
          path: .pagamento-fiscal-monitor/
          include-hidden-files: true
          retention-days: 7
