name: Read current state of 66 payment tickets
on:
  push:
    branches: [audit/payment-66-20261104]
    paths:
      - .github/workflows/audit-payment-66-current.yml
      - scripts/audit-payment-66-current.py
      - scripts/audit-payment-66-cases.json
permissions:
  contents: read
jobs:
  audit:
    if: github.run_attempt == 1
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Read exact roots and sanitized historical events
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: sa-east-1
          AWS_PAGER: ''
        run: python3 scripts/audit-payment-66-current.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: payment-66-current-readonly
          path: .payment-66-audit/
          include-hidden-files: true
          retention-days: 14
