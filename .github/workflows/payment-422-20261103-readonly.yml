name: Payment 422 November 3 read-only diagnosis
on:
  push:
    branches: [fix/idpgto-vinculo-obrigatorio]
    paths:
      - .github/workflows/payment-422-20261103-readonly.yml
      - scripts/audit-payment-422-20261103.py
permissions:
  contents: read
jobs:
  read-only:
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Read current code metadata and only the reported log window
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: sa-east-1
          AWS_PAGER: ''
        run: python3 scripts/audit-payment-422-20261103.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: payment-422-20261103-readback
          path: .payment-422-20261103/
          include-hidden-files: true
          retention-days: 7
