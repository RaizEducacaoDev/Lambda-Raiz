name: Remove permanent uncertain payment creation block
on:
  push:
    branches: [fix/remove-uncertain-creation-20261104]
    paths:
      - .github/workflows/remove-uncertain-creation-release.yml
      - scripts/release-uncertain-creation-removal.py
      - src/functions/rm/post/pagamentoV2Idempotencia.ts
      - src/functions/rm/post/solicitacaoDePagamentoSeguro.ts
permissions:
  contents: read
concurrency:
  group: payment-function-production-publication
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-22.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci --legacy-peer-deps --no-audit --no-fund
      - run: npm run verify:pagamento
      - run: python3 -m unittest discover -s tests -p test_uncertain_creation_release.py
      - run: python3 scripts/release-uncertain-creation-removal.py prepare
      - name: Publish only the two authorized payment module changes
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: sa-east-1
          AWS_PAGER: ''
        run: python3 scripts/release-uncertain-creation-removal.py release
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: uncertain-creation-removal-release
          path: .uncertain-creation-release/
          include-hidden-files: true
          retention-days: 14
  readback:
    needs: release
    runs-on: ubuntu-22.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: uncertain-creation-removal-release
          path: .release-evidence
      - name: Independently verify the active AWS package
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: sa-east-1
          AWS_PAGER: ''
        run: python3 scripts/release-uncertain-creation-removal.py readback --evidence .release-evidence
      - name: Observe execution errors and reread after five minutes
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: sa-east-1
          AWS_PAGER: ''
        run: python3 scripts/release-uncertain-creation-removal.py monitor --evidence .release-evidence
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: uncertain-creation-removal-independent-readback
          path: .uncertain-creation-release/
          include-hidden-files: true
          retention-days: 14
