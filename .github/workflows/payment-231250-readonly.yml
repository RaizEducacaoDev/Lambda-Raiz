name: Read exact payment 231250 AWS evidence
on:
  push:
    branches: [chore/audit-payment-231250-20261109]
    paths:
      - scripts/audit-payment-231250-readonly.py
      - .github/workflows/payment-231250-readonly.yml
permissions:
  contents: read
jobs:
  read-only:
    if: ${{ github.run_attempt == 1 && contains(github.event.head_commit.message, '[audit-231250-readonly-once]') }}
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Read logs and two exact reservation keys without invoking Lambda
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: sa-east-1
          AWS_MAX_ATTEMPTS: '1'
          AWS_PAGER: ''
        run: python scripts/audit-payment-231250-readonly.py
      - uses: actions/upload-artifact@v4
        with:
          name: payment-231250-native-error
          path: .audit231250/aws-readonly.json
          include-hidden-files: true
          retention-days: 1
