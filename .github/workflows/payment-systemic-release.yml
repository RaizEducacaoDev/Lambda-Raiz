name: Payment systemic recovery scoped release
on:
  push:
    branches: [fix/idpgto-vinculo-obrigatorio]
    paths:
      - .github/workflows/payment-systemic-release.yml
      - scripts/deploy-payment-systemic.py
permissions:
  contents: read
concurrency:
  group: payment-function-production-publication
  cancel-in-progress: false
jobs:
  release:
    if: >-
      ${{ github.event_name == 'push' && github.ref == 'refs/heads/fix/idpgto-vinculo-obrigatorio' && github.run_attempt == 1 && contains(github.event.head_commit.message, '[publish-payment-systemic-once]') }}
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --legacy-peer-deps --no-audit --no-fund
      - run: npm run verify:pagamento
      - run: python3 tests/test_payment_systemic_release.py
      - name: Publish one function after native DOC2 and package checks
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: sa-east-1
          AWS_PAGER: ''
          PAYMENT_SYSTEMIC_RELEASE_MODE: deploy
        run: python3 scripts/deploy-payment-systemic.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: payment-systemic-release-evidence
          path: |
            .payment-systemic-release/
            .build/payment-systemic.manifest.json
          include-hidden-files: true
          retention-days: 7
  readback:
    needs: release
    if: ${{ github.run_attempt == 1 }}
    runs-on: ubuntu-22.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: payment-systemic-release-evidence
          path: .systemic-release-evidence
      - name: Verify live code, preserved configuration, sentinels and HTTP negatives independently
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: sa-east-1
          AWS_PAGER: ''
        run: python3 scripts/readback-payment-systemic.py --evidence-directory .systemic-release-evidence
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: payment-systemic-independent-readback
          path: .payment-systemic-readback/
          include-hidden-files: true
          retention-days: 7
