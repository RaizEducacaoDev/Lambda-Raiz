name: Validate payment bank branch before native creation
on:
  push:
    branches: [fix/idpgto-vinculo-obrigatorio]
    paths:
      - .github/workflows/payment-bank-branch-release.yml
      - scripts/release-payment-bank-branch.py
permissions:
  contents: read
concurrency:
  group: payment-function-production-publication
  cancel-in-progress: false
jobs:
  release:
    if: false # One-off publication verified by run41938662542; preserve evidence, do not republish.
    runs-on: ubuntu-22.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci --legacy-peer-deps --no-audit --no-fund
      - run: npm run verify:pagamento
      - run: python3 -m unittest discover -s tests -p test_payment_bank_branch_release.py
      - run: python3 scripts/release-payment-bank-branch.py prepare
      - name: Publish only the reviewed payment wrapper
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: sa-east-1
          AWS_PAGER: ''
        run: python3 scripts/release-payment-bank-branch.py release
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: payment-bank-branch-release
          path: .payment-bank-branch-release/
          include-hidden-files: true
          retention-days: 14
  readback:
    needs: release
    runs-on: ubuntu-22.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: payment-bank-branch-release
          path: .release-evidence
      - name: Independently verify the active AWS package
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: sa-east-1
          AWS_PAGER: ''
        run: python3 scripts/release-payment-bank-branch.py readback --evidence .release-evidence
      - name: Observe errors and confirm active package after five minutes
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: sa-east-1
          AWS_PAGER: ''
        run: python3 scripts/release-payment-bank-branch.py monitor --evidence .release-evidence
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: payment-bank-branch-independent-readback
          path: .payment-bank-branch-release/
          include-hidden-files: true
          retention-days: 14
