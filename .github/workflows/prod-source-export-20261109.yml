name: Export production payment code read only November 9
on:
  push:
    branches: [chore/export-production-payment-20261109-152331]
    paths:
      - .github/workflows/prod-source-export-20261109.yml
      - scripts/export-production-payment-readonly.py
      - .github/prod-payment-export-public.pem
permissions:
  contents: read
jobs:
  export:
    if: >-
      github.run_attempt == 1 && github.event.head_commit.message == 'chore: export active production payment code read only'
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci --legacy-peer-deps --no-audit --no-fund
      - run: python -m pip install cryptography==46.0.3
      - name: Build source for byte comparison with production
        run: npx --no-install esbuild src/functions/rm/post/solicitacaoDePagamento.ts --bundle --platform=node --target=node22 --external:./solicitacaoDePagamento.core.cjs --outfile=.build/solicitacaoDePagamento.cjs --metafile=.build/payment-export-metafile.json
      - name: Read and encrypt active package without invoking Lambda
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: sa-east-1
          AWS_MAX_ATTEMPTS: '1'
          AWS_PAGER: ''
        run: python scripts/export-production-payment-readonly.py
      - uses: actions/upload-artifact@v4
        with:
          name: production-payment-code-encrypted-20261109
          path: .payment-code-export/
          include-hidden-files: true
          retention-days: 1
