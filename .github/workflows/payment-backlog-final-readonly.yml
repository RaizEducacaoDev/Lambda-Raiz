name: Final payment backlog read-only verification
on:
  push:
    branches: [fix/idpgto-vinculo-obrigatorio]
    paths:
      - scripts/read-payment-backlog-final.py
      - .github/workflows/payment-backlog-final-readonly.yml
permissions:
  contents: read
  actions: read
concurrency:
  group: payment-backlog-bank-lease
  cancel-in-progress: false
jobs:
  read-only:
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/fix/idpgto-vinculo-obrigatorio' && github.run_attempt == 1 }}
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Offline read-only scope and sanitizer tests
        run: python3 scripts/read-payment-backlog-final.py --self-test
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 41892943724
          name: payment-bulk-readonly-evidence
          path: .payment-bulk-readonly
      - name: Read pinned runtime, original roots, exact launches and paginated pending inventory
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: sa-east-1
          AWS_MAX_ATTEMPTS: '1'
          AWS_PAGER: ''
        run: python3 scripts/read-payment-backlog-final.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: payment-backlog-final-readonly-evidence
          path: .payment-backlog-final-readonly/
          include-hidden-files: true
          retention-days: 7
