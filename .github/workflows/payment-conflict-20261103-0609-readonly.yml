name: Payment conflict November 3 0609 read-only diagnosis
on:
  push:
    branches: [fix/idpgto-vinculo-obrigatorio]
    paths:
      - .github/workflows/payment-conflict-20261103-0609-readonly.yml
      - scripts/audit-payment-conflict-20261103-0609.py
permissions:
  contents: read
jobs:
  read-only:
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Check safe parsers and reject write operations offline
        run: python3 scripts/audit-payment-conflict-20261103-0609.py --self-test
      - name: Read candidate reservation and sanitized original request diagnostics
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: sa-east-1
          AWS_PAGER: ''
        run: python3 scripts/audit-payment-conflict-20261103-0609.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: payment-conflict-20261103-0609-readback
          path: .payment-conflict-20261103-0609/
          include-hidden-files: true
          retention-days: 7
