name: One pinned existing bank repair 226610
on:
  push:
    branches: [fix/idpgto-vinculo-obrigatorio]
    paths:
      - .github/payment-bank-226610.json
      - .github/workflows/payment-bank-226610.yml
permissions:
  contents: read
  actions: read
concurrency:
  group: payment-backlog-bank-lease
  cancel-in-progress: false
jobs:
  bank:
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/fix/idpgto-vinculo-obrigatorio' && github.run_attempt == 1 }}
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --legacy-peer-deps --no-audit --no-fund
      - run: python3 -m unittest discover -s tests -p test_payment_bank_226610.py
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 41920563872
          name: payment-bank-nine-readonly-evidence
          path: .bank-226610-audit
      - id: mode
        run: |
          python3 - <<'PY'
          import json, os
          c=json.load(open('.github/payment-bank-226610.json'))
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:
            f.write('mode='+c['mode']+'\nrun='+c['approvedPrepareRunId']+'\n')
          PY
      - uses: actions/download-artifact@v4
        if: steps.mode.outputs.mode == 'apply'
        with:
          github-token: ${{ github.token }}
          run-id: ${{ steps.mode.outputs.run }}
          name: payment-bank-226610-private
          path: .approved-bank-226610
      - name: Prepare read-only or execute one separately approved bank link
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: sa-east-1
          AWS_MAX_ATTEMPTS: '1'
          AWS_PAGER: ''
          RECONCILE_ZEEV_TOKEN: ${{ secrets.RECONCILE_ZEEV_TOKEN }}
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/run-payment-bank-226610.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: payment-bank-226610-private
          path: .payment-bank-226610/
          include-hidden-files: true
          retention-days: 1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: payment-bank-226610-lease
          path: .payment-bank-lease/
          include-hidden-files: true
          retention-days: 1
