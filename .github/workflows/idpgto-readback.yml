name: IDPGTO independent AWS readback
on:
  push:
    branches: [fix/idpgto-vinculo-obrigatorio]
    paths:
      - .github/workflows/idpgto-readback.yml
      - scripts/verify-idpgto-aws.py
permissions:
  contents: read
jobs:
  readback:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Independently verify active code, checkpoints and HTTP guard
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: sa-east-1
          AWS_PAGER: ''
        run: python3 scripts/verify-idpgto-aws.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: idpgto-independent-readback
          path: .idpgto-readback/
          include-hidden-files: true
          retention-days: 7
