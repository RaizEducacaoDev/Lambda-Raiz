name: IDPGTO read-only recent failure diagnosis
on:
  push:
    branches: [fix/idpgto-vinculo-obrigatorio]
    paths:
      - .github/workflows/idpgto-recurrence.yml
      - scripts/audit-idpgto-recurrence.py
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Read recent failures without invoking payment
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: sa-east-1
          AWS_PAGER: ''
        run: python3 scripts/audit-idpgto-recurrence.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: idpgto-recurrence-readback
          path: .idpgto-recurrence/
          include-hidden-files: true
          retention-days: 7
