name: Review sanitized payment Lambda error metadata
on:
  push:
    branches: [audit/payment-226927-final-error-20261105]
    paths:
      - scripts/review-payment-errors-20261105.py
      - .github/workflows/review-payment-errors-20261105.yml
permissions:
  contents: read
jobs:
  audit:
    if: ${{ github.run_attempt == 1 }}
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Review fixed diagnostic metadata only
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: sa-east-1
          AWS_MAX_ATTEMPTS: '1'
          AWS_PAGER: ''
        run: python3 scripts/review-payment-errors-20261105.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: payment-errors-review-20261105
          path: .review-payment-errors-20261105/
          include-hidden-files: true
          retention-days: 7
