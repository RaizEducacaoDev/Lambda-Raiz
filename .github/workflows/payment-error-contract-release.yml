name: Restore coherent payment error contract from pre-bank backup
on:
  push:
    branches: [fix/payment-error-contract-baseline-20261105]
    paths:
      - .github/workflows/payment-error-contract-release.yml
      - scripts/release-payment-error-contract.py
permissions:
  contents: read
concurrency:
  group: payment-function-production-publication
  cancel-in-progress: false
jobs:
  release:
    if: false # One-time publication and independent readback: run42095043092.
    runs-on: ubuntu-22.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci --legacy-peer-deps --no-audit --no-fund
      - run: npm run verify:pagamento
      - run: python3 -m unittest discover -s tests -p test_payment_error_contract_release.py
      - run: python3 -m unittest discover -s tests -p test_payment_contract_release.py
      - run: python3 scripts/release-payment-error-contract.py prepare
      - name: Publish reviewed presentation and diagnostics only
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: sa-east-1
          AWS_MAX_ATTEMPTS: '1'
          AWS_PAGER: ''
        run: python3 scripts/release-payment-error-contract.py release
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: payment-error-contract-release
          path: .payment-error-contract-release/
          include-hidden-files: true
          retention-days: 14
  readback:
    needs: release
    runs-on: ubuntu-22.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: payment-error-contract-release
          path: .release-evidence
      - name: Independently verify active package and hashes
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: sa-east-1
          AWS_PAGER: ''
        run: python3 scripts/release-payment-error-contract.py readback --evidence .release-evidence
      - name: Verify active package and execution metrics after five minutes
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: sa-east-1
          AWS_PAGER: ''
        run: python3 scripts/release-payment-error-contract.py monitor --evidence .release-evidence
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: payment-error-contract-readback
          path: .payment-error-contract-release/
          include-hidden-files: true
          retention-days: 14
