name: Read-only audit payment 225136 after fiscal approval
on:
  push:
    branches: [audit/payment-225136-after-approval-20261104]
    paths:
      - scripts/audit-225136-after-approval.py
      - .github/workflows/audit-225136-after-approval.yml
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Read CloudWatch and the durable reservation without invoking Lambda
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: sa-east-1
          AWS_PAGER: ''
        run: python3 scripts/audit-225136-after-approval.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: audit225136-after-approval
          path: .audit225136-after-approval/readback.json
          include-hidden-files: true
          retention-days: 7
