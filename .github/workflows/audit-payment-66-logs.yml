name: Read historical diagnostics for 66 payment tickets
on:
  push:
    branches: [audit/payment-66-20261104]
    paths:
      - .github/workflows/audit-payment-66-logs.yml
      - scripts/audit-payment-66-logs.py
permissions:
  contents: read
jobs:
  logs:
    if: false # One-off read completed in run 41950520914; archived.
    runs-on: ubuntu-22.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Query logs and export allowlisted diagnostics only
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: sa-east-1
          AWS_PAGER: ''
        run: python3 scripts/audit-payment-66-logs.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: payment-66-historical-logs
          path: .payment-66-logs/
          include-hidden-files: true
          retention-days: 14
