name: Payment document post-release read-only audit
on:
  push:
    branches: [fix/idpgto-vinculo-obrigatorio]
    paths:
      - .github/workflows/payment-document-postrelease-readonly.yml
      - scripts/audit-pagamento-documento-readonly.py
permissions:
  contents: read
jobs:
  read-only:
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Read active version, original reservation and creation-free validation logs
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: sa-east-1
          AWS_PAGER: ''
        run: python3 scripts/audit-pagamento-documento-readonly.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: payment-document-postrelease-readback
          path: .payment-document-postrelease/
          include-hidden-files: true
          retention-days: 7
