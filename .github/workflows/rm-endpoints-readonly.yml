name: RM endpoint read-only audit
on:
  push:
    branches: [fix/idpgto-vinculo-obrigatorio]
    paths:
      - .github/workflows/rm-endpoints-readonly.yml
      - scripts/audit-rm-endpoints.py
permissions:
  contents: read
jobs:
  read-only:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Read only endpoint hostnames from the scoped payment function
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: sa-east-1
          AWS_PAGER: ''
        run: python3 scripts/audit-rm-endpoints.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rm-endpoints-readonly
          path: .rm-endpoints/
          include-hidden-files: true
          retention-days: 3
