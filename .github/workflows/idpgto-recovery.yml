name: IDPGTO scoped recovery release
on:
  push:
    branches: [fix/idpgto-vinculo-obrigatorio]
    paths:
      - .github/workflows/idpgto-recovery.yml
      - scripts/deploy-idpgto-recovery.py
permissions:
  contents: read
concurrency:
  group: idpgto-payment-function-production
  cancel-in-progress: false
jobs:
  recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Snapshot only the current payment function
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: sa-east-1
          AWS_PAGER: ''
          IDPGTO_RECOVERY_MODE: snapshot
        run: python3 scripts/deploy-idpgto-recovery.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: idpgto-recovery-evidence
          path: .idpgto-recovery/
          include-hidden-files: true
          retention-days: 7
