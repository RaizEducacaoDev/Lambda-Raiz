name: Recognize completed payment without a new financial entry
on:
  push:
    branches: [fix/reuse-existing-payment-20261104]
    paths:
      - .github/workflows/existing-payment-release.yml
      - scripts/release-existing-payment.py
permissions:
  contents: read
concurrency:
  group: payment-function-production-publication
  cancel-in-progress: false
jobs:
  release:
    if: false # Publication and independent readback completed by run41947569458.
    runs-on: ubuntu-22.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci --legacy-peer-deps --no-audit --no-fund
      - run: npm run verify:pagamento
      - run: python3 -m unittest discover -s tests -p test_existing_payment_release.py
      - run: python3 scripts/release-existing-payment.py prepare
      - name: Publish the reviewed payment wrapper
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: sa-east-1
          AWS_PAGER: ''
        run: python3 scripts/release-existing-payment.py release
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: existing-payment-release
          path: .existing-payment-release/
          include-hidden-files: true
          retention-days: 14
  readback:
    needs: release
    runs-on: ubuntu-22.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: existing-payment-release
          path: .release-evidence
      - name: Independently verify the active AWS package
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: sa-east-1
          AWS_PAGER: ''
        run: python3 scripts/release-existing-payment.py readback --evidence .release-evidence
      - name: Observe errors and verify active package after five minutes
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: sa-east-1
          AWS_PAGER: ''
        run: python3 scripts/release-existing-payment.py monitor --evidence .release-evidence
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: existing-payment-independent-readback
          path: .existing-payment-release/
          include-hidden-files: true
          retention-days: 14
