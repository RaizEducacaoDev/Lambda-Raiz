AWSTemplateFormatVersion: '2010-09-09'
Description: Preparacao opcional da idempotencia de pagamentos; nao ativa a Lambda.
Parameters:
  Stage:
    Type: String
    AllowedValues: [dev, prod]
  LambdaRoleName:
    Type: String
    Description: Nome da role existente da funcao; confirmar antes de provisionar.
Resources:
  Pagamentos:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Sub lambda-raiz-${Stage}-pagamento-v2
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
      SSESpecification:
        SSEEnabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      # Sem TTL: expirar/apagar reservas permitiria duplicar movimentos no RM.
  AcessoPagamentos:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      Roles: [!Ref LambdaRoleName]
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Action: [dynamodb:PutItem, dynamodb:GetItem, dynamodb:UpdateItem]
            Resource: !GetAtt Pagamentos.Arn
            # A role do servico pode ser compartilhada por outras funcoes.
            # Somente o codigo desta Lambda recebe a nova permissao.
            Condition:
              ArnEquals:
                lambda:SourceFunctionArn: !Sub arn:${AWS::Partition}:lambda:${AWS::Region}:${AWS::AccountId}:function:lambda-raiz-${Stage}-solicitacaoDePagamento
Outputs:
  TableName:
    Value: !Ref Pagamentos
